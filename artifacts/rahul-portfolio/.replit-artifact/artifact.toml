kind = "web"
previewPath = "/"
title = "Rahul Gupta Portfolio"
description = "A polished personal portfolio for Rahul Gupta, a JavaScript-focused full-stack developer, showcasing his experience, projects, skills, and education."
version = "1.0.0"
id = "artifacts/rahul-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24836

[services.development]
run = "pnpm --filter @workspace/rahul-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rahul-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/rahul-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24836"
BASE_PATH = "/"
