<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17203f"/>
      <stop offset="100%" stop-color="#0e1428"/>
    </linearGradient>
    <linearGradient id="rgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b9f3ee"/>
      <stop offset="100%" stop-color="#38d4c7"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Badge -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bgGrad)" stroke="#b9f3ee" stroke-opacity="0.35" stroke-width="4"/>
  
  <!-- Status Indicator Dot -->
  <circle cx="102" cy="24" r="6" fill="#f0784f"/>
  
  <!-- RG Monogram -->
  <text x="64" y="80" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-weight="900" 
        font-size="52" 
        letter-spacing="-1px"
        fill="url(#rgGrad)" 
        text-anchor="middle">RG</text>
        
  <!-- Accent Line -->
  <rect x="38" y="94" width="52" height="4" rx="2" fill="#f0784f"/>
</svg>
